# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # A job-level ceiling well below GitHub's own 6h default, so a hung
    # network call (a flaky DNS lookup against a source API, say) fails loud
    # within the hour instead of occupying a runner silently all day.
    timeout-minutes: 60
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # The vignettes are .qmd, which pkgdown renders through the quarto CLI
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # The report's own figures (board_2026*.qmd) read a frozen vintage
      # copy of this same data (inst/extdata/v<year>_*.parquet, committed to
      # git) and are unaffected by this step; every other article reads the
      # live files this step (re)writes, which are themselves gitignored and
      # so never carried over between runs. FIPROD_UPDATE_DATA=true makes
      # data-raw/data_main.R re-fetch from Eurostat/OECD first, instead of
      # just recombining whatever happens to already be on disk (nothing, on
      # a fresh checkout).
      - name: Fetch live source data and rebuild combined tables
        env:
          FIPROD_UPDATE_DATA: "true"
        run: |
          if (requireNamespace("devtools", quietly = TRUE)) devtools::load_all() else library(fiprod)
          library(pttdatahaku)
          source("data-raw/read_ggdc_data.R")
          source("data-raw/data_main.R")
        shell: Rscript {0}

      # quiet = FALSE (build_site_github_pages()'s ... forwards to
      # build_site(), which has this parameter) makes a quarto article
      # failure here show the real quarto CLI error directly in this step's
      # log, instead of just "Rerun with quiet = FALSE to see the full
      # error message" - exactly the debug step we've repeatedly had to
      # add and remove by hand, but permanent.
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, quiet = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
